; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Configuration commune ────────────────────────────────────────────────────
[env_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit TinyUSB Library @ ^3.1.4
    fortyseveneffects/MIDI Library @ ^5.0.2
    mathertel/RotaryEncoder @ ^1.5.3
    adafruit/Adafruit PCF8574 @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_MIDI=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
    ; Décommenter pour le développement (désactive le watchdog, active les logs de boot)
    ; -DDEBUG_BUILD

lib_ignore =
    SdFat - Adafruit Fork

monitor_speed = 115200
monitor_filters =
    send_on_enter
    colorize

; ── Firmware MIDI simple (branche main) ─────────────────────────────────────
[env:param8_simple]
extends = env_base
src_filter = +<src/> -<src/sequencer/>

; ── Firmware avancé avec séquenceur (branche feature/step-sequencer) ────────
[env:param8_advanced]
extends = env_base
build_flags =
    ${env_base.build_flags}
    -DSEQUENCER_ENABLED
